<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fdfdfd">
  <meta name="robots" content="noindex">
  <title>Benjamin Shi</title>
  <link rel="icon" href="/favicon.ico?v=4" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <link rel="apple-touch-icon" href="/favicon-180.png?v=4">
  <!-- Cloudflare Pages serves this root 404.html for every unmatched path
       (including under /ch/ etc.). Same type, colours and voice as the
       page; no scripts, and the links are absolute so it works anywhere. -->
  <style>
    :root {
      color-scheme: light;
      --bg: #fdfdfd;
      --text: #222;
      --hover: #747474;
    }
    html { background: var(--bg); }
    body {
      font-family: "EB Garamond", Garamond, "Adobe Garamond Pro", Georgia, serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 0 24px;
      font-size: 20px;
      line-height: 1.2;
      color: var(--text);
      background: var(--bg);
    }
    h1 { font-weight: 500; font-size: 2em; margin: 0 0 0.2em 0; }
    p { margin: 0 0 0.7em 0; }
    a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--hover); }
    .lang-switch {
      margin-top: 1.8em;
      font-size: 0.8em;
      color: var(--hover);
      line-height: 1.4;
    }
    .lang-switch a { color: var(--hover); text-decoration: none; }
    .lang-switch a:hover { color: var(--text); }
    .lang-switch .sep { padding: 0 0.45em; opacity: 0.6; }
    @media (max-width: 600px) {
      body { margin: 32px auto; font-size: 18px; }
      h1 { font-size: 1.8em; }
    }
  </style>
</head>
<body>
  <h1>Benjamin Shi</h1>
  <p>there is nothing at this address.</p>
  <p><a href="/">back to the page</a></p>

  <nav class="lang-switch" aria-label="language">
    <a href="/" hreflang="en" lang="en">english</a><span class="sep">·</span><a href="/ch/" hreflang="zh" lang="zh">中文</a><span class="sep">·</span><a href="/gr/" hreflang="el" lang="el">ελληνικά</a><span class="sep">·</span><a href="/lt/" hreflang="la" lang="la">latina</a><span class="sep">·</span><a href="/hb/" hreflang="he" lang="he">עברית</a>
  </nav>
</body>
</html>
