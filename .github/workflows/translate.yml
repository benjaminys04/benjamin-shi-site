name: Translate pages

# Whenever the canonical English page changes on main, regenerate the
# Chinese (/ch), Greek (/gr), Latin (/lt) and Hebrew (/hb) copies with Claude
# and commit them. The commit only touches the translated folders, never
# index.html, so it does not re-trigger this workflow (no loop). Its message
# carries "[skip actions]" — honored by GitHub Actions (extra loop guard) but
# NOT by Cloudflare Pages, so the translations deploy immediately. (The old
# "[skip ci]" marker also suppressed the Cloudflare build, leaving fresh
# translations undeployed until the next unrelated push.)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/translate.mjs"
      - ".github/workflows/translate.yml"
  workflow_dispatch: {}

# Avoid overlapping runs racing to commit.
concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  translate:
    # The bot pushes to main, so it must only ever run FROM main: a manual
    # run dispatched on a feature branch would otherwise rebase that branch
    # onto main and publish it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the bot rebases before it pushes

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Regenerate translations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate.mjs

      - name: Commit updated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ch/ gr/ lt/ hb/
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-translate pages [skip actions]"
          # main may have moved while the four translations ran: a push that
          # does not touch index.html neither cancels nor re-triggers this
          # job, and a plain push would then be rejected, leaving the live
          # translations stale. Rebase onto origin/main and retry the push.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase conflict on attempt $attempt — a translated folder was edited upstream by hand."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt; retrying."
            sleep 5
          done
          echo "::error::Could not push the translations after 3 attempts."
          exit 1
